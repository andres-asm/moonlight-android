name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Build debug APKs
        run: ./gradlew assembleNonRootDebug assembleRootDebug

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --ignore-garbage -d > keystore.jks

      - name: Build release APKs
        if: env.HAS_KEYSTORE == 'true'
        run: |
          ./gradlew assembleNonRootRelease assembleRootRelease \
            -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
            -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload nonRoot debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-nonroot-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk

      - name: Upload root debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-root-debug
          path: app/build/outputs/apk/root/debug/*.apk

      - name: Upload nonRoot release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-nonroot-release
          path: app/build/outputs/apk/nonRoot/release/*.apk

      - name: Upload root release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-root-release
          path: app/build/outputs/apk/root/release/*.apk
